name: ai-gateway

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: ai-gateway-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_gateway}
      MYSQL_USER: ${MYSQL_USER:-ai_gateway}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_gateway_password}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:latest
    container_name: ai-gateway-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: ai-gateway-api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-ai_gateway}:${MYSQL_PASSWORD:-ai_gateway_password}@mysql:3306/${MYSQL_DATABASE:-ai_gateway}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "1"
      ALLOW_PRIVATE_UPSTREAMS: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: ai-gateway-web
    environment:
      PORT: 80
      API_HOST: api
      API_PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  mock-upstream:
    profiles: ["test"]
    build:
      context: docker/mock-upstream
      dockerfile: Dockerfile
    container_name: ai-gateway-mock
    ports:
      - "4010:4010"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
